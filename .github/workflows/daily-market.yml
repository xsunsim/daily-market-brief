name: Daily market brief

on:
  schedule:
    # 18:25 ET Mon-Fri (22:25 UTC during EDT, 23:25 UTC during EST — after close either way)
    - cron: '25 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate brief
        run: python3 scripts/market_brief.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports README.md
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "Market brief $(date +%F)"
            git push
          fi
